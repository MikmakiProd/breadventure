  :root{
    --paper:#F6EFE2; --paper2:#EFE6D4; --cream:#FBF8F1;
    --ink:#241C12; --ink2:#6B5D49; --line:#DCD0BA; --line2:#CBBB9F;
    --amber:#B57B2E; --amber-soft:rgba(181,123,46,.12);
    --serif:'Cormorant', Georgia, 'Times New Roman', serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --fun:'Pacifico', 'Comic Sans MS', cursive;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  html{background:var(--ink);height:100dvh;height:100vh}
  body{min-height:100dvh;min-height:100vh;width:100%;overflow:hidden;overscroll-behavior:none;
    background:var(--ink);font-family:var(--sans);color:var(--ink);
    -webkit-user-select:none;user-select:none}
  #app{position:relative;width:100%;height:100dvh;height:100vh;overflow:hidden}
  img{-webkit-user-drag:none;user-drag:none}

  #cam{position:absolute;top:0;left:0;width:100%;height:100dvh;height:100vh;object-fit:cover;object-position:center;z-index:0;background:#000}
  body.no-cam #cam{display:none}
  body.no-cam{background:
    radial-gradient(120% 90% at 50% 18%, #FBF8F1 0%, var(--paper) 55%, var(--paper2) 100%)}
  #camMsg{position:fixed;top:calc(74px + var(--safe-t));left:0;right:0;text-align:center;z-index:5;
    color:var(--ink2);font-size:13px;font-weight:500;padding:0 34px;display:none;line-height:1.5}
  body.no-cam #camMsg{display:block}

  /* filter overlay layer */
  #fxLayer{position:absolute;top:0;left:0;width:100%;height:100dvh;height:100vh;z-index:8;pointer-events:none;overflow:hidden}
  #fxLayer.active{pointer-events:auto;touch-action:none}
  .sticker{position:absolute;touch-action:none;will-change:transform;background:transparent}
  .sticker .simg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;display:block}
  .sticker .sdel{position:absolute;top:0;right:0;width:30px;height:30px;border:0;border-radius:50%;
    background:var(--ink);color:var(--paper);font-size:14px;line-height:1;display:none;
    align-items:center;justify-content:center;z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .sticker.on{outline:2px dashed rgba(181,123,46,.9);outline-offset:2px;border-radius:6px}
  .sticker.on .sdel{display:flex}
  #frameMask{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none}
  #fxHint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(158px + var(--safe-b));
    z-index:9;color:var(--paper);font-size:12px;font-weight:500;background:rgba(36,28,18,.78);
    padding:8px 15px;border-radius:20px;max-width:82vw;text-align:center;pointer-events:none;opacity:0;transition:.3s}
  #fxHint.on{opacity:1}

  /* language button */
  #langBtn{position:fixed;top:calc(13px + var(--safe-t));right:13px;z-index:30;border:1px solid var(--line2);
    background:rgba(251,248,241,.82);backdrop-filter:blur(8px);color:var(--ink);border-radius:22px;
    padding:8px 13px;font-size:12.5px;font-weight:600;letter-spacing:.06em;display:flex;align-items:center;gap:7px;
    font-family:var(--sans)}
  #langBtn .globe{width:15px;height:15px;display:block;color:var(--amber)}
  #langBtn .globe svg{width:100%;height:100%;display:block}
  #langMenu{position:fixed;top:calc(52px + var(--safe-t));right:13px;z-index:31;background:var(--cream);
    border:1px solid var(--line);border-radius:16px;padding:7px;display:none;flex-direction:column;
    min-width:172px;box-shadow:0 18px 44px rgba(36,28,18,.20)}
  #langMenu.on{display:flex}
  #langMenu button{border:0;background:none;color:var(--ink);text-align:left;padding:10px 13px;border-radius:11px;
    font-size:14.5px;display:flex;gap:10px;align-items:center;font-family:var(--sans);font-weight:500}
  #langMenu button .flg{font-size:15px}
  #langMenu button.sel{background:var(--amber-soft);color:var(--amber);font-weight:700}

  /* start overlay */
  #startOverlay{position:absolute;top:0;left:0;width:100%;height:100dvh;height:100vh;z-index:60;
    background:radial-gradient(125% 95% at 50% 16%, #FBF8F1 0%, var(--paper) 52%, var(--paper2) 100%);
    touch-action:none}
  #startOverlay.hidden{display:none}
  #startInner{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:0;text-align:center;padding:calc(24px + var(--safe-t)) 26px calc(20px + var(--safe-b))}
  #homeLogo{width:min(72vw,320px);max-height:44vh;height:auto;display:block;object-fit:contain}
  #tagline{margin:22px 0 0;color:var(--ink);font-family:var(--serif);font-weight:600;
    font-size:clamp(21px,6.1vw,27px);letter-spacing:.02em;line-height:1.25}
  #tagline .dot{color:var(--amber);margin:0 .28em}
  #startBtn{margin-top:28px;border:0;padding:13px 46px;border-radius:34px;font-size:15px;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;color:var(--paper);background:var(--ink);font-family:var(--sans);
    box-shadow:0 10px 26px rgba(36,28,18,.24)}
  #startBtn:active{transform:scale(.97)}
  #startCopy{position:fixed;left:0;right:0;bottom:calc(16px + var(--safe-b));text-align:center;
    color:var(--ink2);font-size:10.5px;letter-spacing:.05em;line-height:1.7}
  #startCopy .ver{opacity:.7}
  #installTip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(58px + var(--safe-b));
    z-index:62;display:none;align-items:center;gap:11px;width:min(92vw,360px);
    background:var(--ink);color:var(--paper);border-radius:16px;padding:11px 12px}
  #installTip .ic{flex:0 0 auto;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
  #installTip .ic svg{width:24px;height:24px;display:block}
  #installTip .body{flex:1;min-width:0;text-align:left;line-height:1.35}
  #installTip .body b{display:block;font-size:12.5px;color:var(--amber);margin-bottom:2px;font-weight:700}
  #installTip .body span{font-size:12px}
  #installTip #tipClose{flex:0 0 auto;width:24px;height:24px;border:0;border-radius:50%;
    background:rgba(255,255,255,.18);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}

  /* scrim + sheets */
  #scrim{position:absolute;inset:0;width:100%;height:100dvh;height:100vh;z-index:45;background:rgba(36,28,18,.42);
    opacity:0;pointer-events:none;transition:.25s}
  #scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:88vh;color:var(--ink);
    background:var(--paper);border-radius:26px 26px 0 0;transform:translateY(103%);
    transition:transform .34s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;
    padding-bottom:var(--safe-b);box-shadow:0 -14px 44px rgba(36,28,18,.2)}
  .sheet.open{transform:translateY(0)}
  .grab{width:40px;height:4px;border-radius:3px;background:var(--line2);margin:10px auto 0}
  .sheet-h{display:flex;align-items:baseline;justify-content:center;position:relative;padding:16px 22px 6px}
  .sheet-h h2{margin:0;font-family:var(--serif);font-weight:600;font-size:30px;letter-spacing:.01em;color:var(--ink)}
  .sheet-h .x{position:absolute;top:12px;right:16px;width:34px;height:34px;border:1px solid var(--line2);
    border-radius:50%;background:var(--cream);color:var(--ink);font-size:16px;line-height:1;
    display:flex;align-items:center;justify-content:center}
  .sheet-body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 22px 30px}

  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--amber)}
  .rule{height:1px;background:var(--line);margin:20px 0}
  .lead{font-family:var(--serif);font-size:20px;line-height:1.45;color:var(--ink);margin:12px 2px 0;font-weight:600}
  .body-p{font-size:14.5px;line-height:1.66;color:var(--ink2);margin:12px 2px 0}

  /* about detail rows */
  .detail{margin-top:20px}
  .detail .lbl{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--amber);margin-bottom:5px}
  .detail .val{font-size:14.5px;line-height:1.55;color:var(--ink);white-space:pre-line}
  .about-links{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .lnk{flex:1 1 auto;min-width:130px;display:flex;align-items:center;gap:10px;text-decoration:none;
    background:var(--cream);border:1px solid var(--line);border-radius:15px;padding:12px 14px;color:var(--ink)}
  .lnk .li{width:20px;height:20px;flex:0 0 auto;color:var(--ink)}
  .lnk .li svg{width:100%;height:100%;display:block}
  .lnk b{font-size:13.5px;font-weight:600}
  .lnk small{display:block;color:var(--ink2);font-size:11.5px}
  .webRow{display:flex;align-items:center;gap:10px;margin-top:14px;text-decoration:none;color:var(--amber);
    font-weight:600;font-size:14.5px;letter-spacing:.02em}
  .webRow svg{width:16px;height:16px}
  .legal{margin-top:26px;border-top:1px solid var(--line);padding-top:16px}
  .legal h3{color:var(--amber);font-size:10.5px;margin:15px 0 5px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
  .legal h3:first-child{margin-top:0}
  .legal p{color:var(--ink2);font-size:12px;line-height:1.6;margin:0}
  .legal .cp{color:var(--ink2);font-size:11.5px;margin-top:14px;text-align:center}
  .legal .ver{color:var(--ink2);font-size:11px;font-weight:700;text-align:center;margin-top:3px;letter-spacing:.05em}
  .legal a{color:var(--amber);text-decoration:underline}
  .aboutQr{width:116px;height:116px;margin:18px auto 6px;background:var(--ink2)}

  /* menu */
  .menu-note{font-size:13px;line-height:1.6;color:var(--ink2);margin:10px 2px 2px;text-align:center}
  .cat-title{display:flex;align-items:center;gap:14px;margin:26px 0 16px}
  .cat-title span{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--ink);white-space:nowrap}
  .cat-title:before,.cat-title:after{content:"";height:1px;background:var(--line);flex:1}
  .menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
  .m-item{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}
  .m-pastille{width:100%;aspect-ratio:1/1;border-radius:50%;overflow:hidden;position:relative;
    background:var(--cream);border:1px solid var(--line);box-shadow:0 4px 14px rgba(36,28,18,.08)}
  .m-pastille img{width:100%;height:100%;object-fit:cover;display:block;background:var(--paper2)}
  .m-pastille .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--line2)}
  .m-pastille .ph svg{width:48%;height:48%}
  .m-item.sold .m-pastille img{filter:grayscale(.85) opacity(.5)}
  .m-item.sold .m-pastille:after{content:attr(data-sold);position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%) rotate(-6deg);background:var(--ink);color:var(--paper);
    font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:20px;white-space:nowrap}
  .m-name{font-size:12.5px;line-height:1.3;color:var(--ink);font-weight:500}
  .order-btn{display:block;width:100%;margin-top:26px;text-align:center;text-decoration:none;
    background:var(--ink);color:var(--paper);border-radius:16px;padding:15px;font-size:14px;font-weight:700;letter-spacing:.06em}

  /* Snap filter bar */
  #filterBar{position:fixed;left:0;right:0;bottom:0;z-index:44;padding:12px 0 calc(12px + var(--safe-b));
    background:linear-gradient(180deg,rgba(36,28,18,0),rgba(36,28,18,.5) 24%,rgba(36,28,18,.82) 60%);
    backdrop-filter:blur(9px);display:none;flex-direction:column;gap:11px}
  #filterBar.on{display:flex}
  #nameRow{display:flex;align-items:center;gap:9px;padding:0 14px}
  #nameInput{flex:1;min-width:0;border:1px solid rgba(246,239,226,.35);background:rgba(246,239,226,.12);
    color:var(--paper);border-radius:22px;padding:11px 16px;font-size:14px;font-family:var(--fun);letter-spacing:.02em}
  #nameInput::placeholder{color:rgba(246,239,226,.55);font-family:var(--sans);letter-spacing:0}
  #clearBtn{flex:0 0 auto;border:1px solid rgba(246,239,226,.35);background:rgba(246,239,226,.10);color:var(--paper);
    border-radius:22px;padding:11px 15px;font-size:12.5px;font-weight:600;letter-spacing:.04em}
  #filterStrip{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 4px;-webkit-overflow-scrolling:touch;align-items:flex-end}
  #filterStrip::-webkit-scrollbar{display:none}
  .fgroup{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
  .fgroup .glabel{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(246,239,226,.62);padding-left:2px}
  .fgroup .grow{display:flex;gap:8px}
  .fchip{flex:0 0 auto;width:58px;height:58px;border-radius:16px;border:2px solid transparent;
    background:rgba(246,239,226,.14);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:6px}
  .fchip img{max-width:100%;max-height:100%;object-fit:contain;display:block}
  .fchip .fx{width:30px;height:30px;color:var(--paper)}
  .fchip .fx svg{width:100%;height:100%;display:block}
  .fchip.sel{border-color:var(--amber);background:rgba(181,123,46,.24)}
  .fdivide{flex:0 0 auto;width:1px;align-self:stretch;background:rgba(246,239,226,.2);margin:14px 2px 2px}
  #filterActions{display:flex;gap:10px;align-items:center;padding:0 14px}
  #snapBtn{flex:1;border:0;border-radius:40px;padding:16px;font-size:16px;font-weight:800;letter-spacing:.08em;
    color:var(--ink);background:var(--paper)}
  #snapBtn:active{transform:scale(.97)}
  #filterClose{border:1px solid rgba(246,239,226,.35);border-radius:40px;width:52px;height:52px;font-size:19px;
    color:var(--paper);background:rgba(246,239,226,.10)}

  /* tab bar */
  #tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(4,1fr);
    gap:2px;padding:9px 10px calc(10px + var(--safe-b));
    background:linear-gradient(180deg,rgba(36,28,18,0),rgba(36,28,18,.34))}
  body.no-cam #tabbar{background:linear-gradient(180deg,rgba(246,239,226,0),rgba(239,230,212,.9))}
  #tabbar button{border:0;background:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;
    gap:5px;padding:4px 2px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-family:var(--sans)}
  #tabbar button .ring{width:52px;height:52px;border-radius:50%;border:1.4px solid var(--ink);
    background:rgba(251,248,241,.9);display:flex;align-items:center;justify-content:center;transition:.16s}
  #tabbar button .ring svg{width:24px;height:24px;color:var(--ink)}
  #tabbar button .lbl{color:var(--ink);text-shadow:0 1px 3px rgba(246,239,226,.6)}
  body:not(.no-cam) #tabbar button .lbl{color:var(--paper);text-shadow:0 1px 4px rgba(36,28,18,.55)}
  #tabbar button:active .ring{transform:scale(.9)}
  #tabbar button.active .ring{border-color:var(--amber);background:var(--amber)}
  #tabbar button.active .ring svg{color:var(--paper)}
  #tabbar.hide{display:none}
  body:not(.started) #tabbar{display:none}

  /* photo preview + flash */
  #flash{position:absolute;inset:0;width:100%;height:100dvh;height:100vh;z-index:70;background:#fff;opacity:0;pointer-events:none}
  #flash.on{animation:fl .26s ease-out}
  @keyframes fl{0%{opacity:.9}100%{opacity:0}}
  #photoPrev{position:absolute;inset:0;width:100%;height:100dvh;height:100vh;z-index:66;background:rgba(24,18,10,.94);
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;
    padding-bottom:calc(24px + var(--safe-b))}
  #photoPrev.on{display:flex}
  #photoImg{max-width:100%;max-height:66vh;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  #photoPrev .row{display:flex;gap:12px}
  #savePhoto,#photoClose{border:0;border-radius:16px;padding:14px 28px;font-size:14px;font-weight:700;
    letter-spacing:.04em;text-decoration:none;text-align:center}
  #savePhoto{color:var(--ink);background:var(--paper);font-weight:800}
  #photoClose{color:var(--paper);background:rgba(246,239,226,.14);border:1px solid rgba(246,239,226,.3)}

  /* live name preview (top centre of the snap) */
  #liveName{position:absolute;top:calc(52px + var(--safe-t));left:0;right:0;text-align:center;
    font-family:var(--fun);font-size:clamp(26px,7.4vw,44px);line-height:1.12;color:#fff;
    text-shadow:0 2px 12px rgba(0,0,0,.5);pointer-events:none;z-index:9;padding:0 26px;
    display:none;word-break:break-word}
  #liveName.on{display:block}
  #liveName.paper{color:var(--ink);text-shadow:none}

  /* snap first-run intro popup */
  #snapIntro{position:absolute;inset:0;z-index:68;background:rgba(24,18,10,.82);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;padding:24px;padding-bottom:calc(24px + var(--safe-b))}
  #snapIntro.on{display:flex}
  .si-card{position:relative;max-width:min(86vw,420px);display:flex;flex-direction:column;align-items:center;gap:16px}
  #siImg{max-width:100%;max-height:70vh;border-radius:22px;box-shadow:0 22px 60px rgba(0,0,0,.5);display:block}
  #siClose{border:0;border-radius:30px;padding:13px 42px;font-size:14px;font-weight:800;letter-spacing:.08em;
    color:var(--ink);background:var(--paper)}
  #siClose:active{transform:scale(.97)}
</style>
</head>

  /* ---------------- camera ---------------- */
  const video = $('cam');
  async function startCamera(){
    const tries=[{video:{facingMode:{ideal:'environment'}},audio:false},{video:true,audio:false}];
    for(const c of tries){
      try{ const s=await navigator.mediaDevices.getUserMedia(c); video.srcObject=s; await video.play(); return; }
      catch(e){}
    }
    document.body.classList.add('no-cam');
  }

  /* ---------------- boot ---------------- */
  $('startBtn').addEventListener('click', boot);
  async function boot(){
    document.body.classList.add('started');
    $('startOverlay').classList.add('hidden');
    try{ document.fonts.load('400 40px Pacifico'); document.fonts.load('600 30px Cormorant'); }catch(e){}
    await startCamera();
  }

  /* ---------------- language ---------------- */
  function buildLangMenu(){
    const m=$('langMenu'); m.innerHTML='';
    LANGS.forEach(L=>{
      const b=document.createElement('button');
      b.className = L.c===lang?'sel':'';
      b.innerHTML = `<span>${L.n}</span>`;
      b.addEventListener('click',()=>{ lang=L.c; applyLang(); m.classList.remove('on'); });
      m.appendChild(b);
    });
  }
  $('langBtn').addEventListener('click',(e)=>{ e.stopPropagation(); $('langMenu').classList.toggle('on'); });
  document.addEventListener('click',(e)=>{
    const menu=$('langMenu');
    if(menu.classList.contains('on') && !menu.contains(e.target) && !$('langBtn').contains(e.target)) menu.classList.remove('on');
  });

  function applyLang(){
    const t=tr();
    document.documentElement.lang=lang;
    $('langCur').textContent=lang.toUpperCase();
    $('langBtn').querySelector('.globe').innerHTML=IC.globe;
    // tagline stays brand English: "Dress It. Snap It. Share It."
    $('startBtn').textContent=t.enter;
    $('tabAbout').textContent=t.tAbout; $('tabMenu').textContent=t.tMenu;
    $('tabSnap').textContent=t.tSnap; $('tabFollow').textContent=t.tFollow;
    // tab icons
    document.querySelector('[data-act="about"] .ring').innerHTML=IC.about;
    document.querySelector('[data-act="menu"] .ring').innerHTML=IC.menu;
    document.querySelector('[data-act="snap"] .ring').innerHTML=IC.snap;
    document.querySelector('[data-act="follow"] .ring').innerHTML=IC.follow;
    // about
    $('aboutHead').textContent=t.aboutHead;
    $('aboutLead').textContent=t.aboutLead;
    $('aboutBody').textContent=t.aboutBody;
    $('lblHours').textContent=t.lblHours; $('valHours').textContent=t.valHours;
    $('lblFind').textContent=t.lblFind; $('valAddr').textContent=t.valAddr;
    $('webBtn').textContent=t.webBtn; $('webRow').href=SITE_URL;
    $('igLabel').textContent=t.igLabel; $('igLnk').href=IG_URL;
    $('fbLabel').textContent=t.fbLabel; $('fbLnk').href=FB_URL;
    $('termsH').textContent=t.termsH; $('termsP').textContent=t.termsP;
    $('privH').textContent=t.privH; $('privP').textContent=t.privP;
    $('copyH').textContent=t.copyH; $('copyP').textContent=t.copyP;
    $('devP').innerHTML=t.dev.replace('Mikmaki Interactive','<a href="https://www.tiktok.com/@mikmaki.interactive" target="_blank" rel="noopener">Mikmaki Interactive</a>');
    $('verP').textContent=VERSION;
    // menu
    $('menuHead').textContent=t.menuHead; $('menuNote').textContent=t.menuNote;
    $('orderBtn').textContent=t.orderBtn; $('orderBtn').href=ORDER_URL;
    buildMenu();
    // snap
    $('nameInput').placeholder=t.snapName;
    $('clearBtn').textContent=t.snapClear;
    $('snapBtn').textContent=t.snapBtn;
    buildFilterStrip();
    buildLangMenu();
  }

  function openSheet(id){ closeAll(); if(sheets[id]){ sheets[id].classList.add('open'); $('scrim').classList.add('on'); } setActiveTab(id); }
  function closeSheets(){ Object.values(sheets).forEach(s=>s.classList.remove('open')); $('scrim').classList.remove('on'); setActiveTab(null); }
  function closeAll(){ closeSheets(); exitPhoto(); }
  $('scrim').addEventListener('click', closeSheets);
  document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeSheets));

  function setActiveTab(act){
    document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('active', b.dataset.act===act));
  }

  /* ---------------- menu ---------------- */
  function menuCard(item){
    const el=document.createElement('div');
    el.className='m-item'+(item.sold?' sold':'');
    const past=document.createElement('div'); past.className='m-pastille';
    if(item.sold) past.setAttribute('data-sold', tr().soldOut);
    const img=document.createElement('img');
    img.loading='lazy'; img.decoding='async'; img.src=item.img; img.alt=item.n;
    img.addEventListener('error',()=>{ img.remove(); const ph=document.createElement('div'); ph.className='ph'; ph.innerHTML=IC.breadPh; past.appendChild(ph); });
    past.appendChild(img);
    const nm=document.createElement('div'); nm.className='m-name'; nm.textContent=item.n;
    el.appendChild(past); el.appendChild(nm);
    return el;
  }
  function buildMenu(){
    const t=tr();
    const breads=MENU.filter(m=>m.c==='breads'), sweets=MENU.filter(m=>m.c==='sweets');

  }

  /* ============================================================
     SNAP — multi stickers + heart/star frame + name + QR
     ============================================================ */
  const GROUPS=[
    {cat:'hats', key:'grpHats'},{cat:'glasses', key:'grpGlasses'},{cat:'eyes', key:'grpEyes'},
    {cat:'mouths', key:'grpMouths'},{cat:'hands', key:'grpHands'},{cat:'legs', key:'grpLegs'}
  ];
  let activeFrame='none';

  function buildFilterStrip(){
    const s=$('filterStrip'); s.innerHTML=''; const t=tr();
    // frames group
    const fg=document.createElement('div'); fg.className='fgroup';
    fg.innerHTML=`<div class="glabel">${t.grpFrames}</div>`;
    const frow=document.createElement('div'); frow.className='grow';
    [['none',IC.none,t.frNone],['heart',IC.heart,t.frHeart],['star',IC.star,t.frStar]].forEach(([f,ic,lbl])=>{
      const b=document.createElement('button'); b.className='fchip'+(f===activeFrame?' sel':'');
      b.title=lbl; b.innerHTML=`<span class="fx">${ic}</span>`;
      b.addEventListener('click',()=>setFrame(f));
      frow.appendChild(b);
    });
    fg.appendChild(frow); s.appendChild(fg);
    // item groups
    GROUPS.forEach(g=>{
      const items=FILTERS.filter(x=>x.cat===g.cat); if(!items.length) return;
      const div=document.createElement('div'); div.className='fdivide'; s.appendChild(div);
      const grp=document.createElement('div'); grp.className='fgroup';
      grp.innerHTML=`<div class="glabel">${t[g.key]}</div>`;
      const row=document.createElement('div'); row.className='grow';
      items.forEach(it=>{
        const b=document.createElement('button'); b.className='fchip';
        const im=document.createElement('img'); im.src=it.url; im.alt=''; b.appendChild(im);
        b.addEventListener('click',()=>addSticker(it));
        row.appendChild(b);
      });
      grp.appendChild(row); s.appendChild(grp);
    });
  }

  function enterPhoto(){
    $('filterBar').classList.add('on');
    $('tabbar').classList.add('hide');
    $('fxLayer').classList.add('active');
    setActiveTab('snap');
    syncLiveName();
    try{ if(!localStorage.getItem('bv_snap_intro')){ showSnapIntro(); localStorage.setItem('bv_snap_intro','1'); } }catch(e){}
  }
  function showSnapIntro(){ $('siClose').textContent=(CLOSE[lang]||CLOSE.en); $('snapIntro').classList.add('on'); }
  $('siClose').addEventListener('click',()=>$('snapIntro').classList.remove('on'));
  $('snapIntro').addEventListener('click',e=>{ if(e.target===$('snapIntro')) $('snapIntro').classList.remove('on'); });
  function exitPhoto(){
    $('filterBar').classList.remove('on');
    $('tabbar').classList.remove('hide');
    $('fxLayer').classList.remove('active');
    clearAll();
    $('fxHint').classList.remove('on');
    $('liveName').classList.remove('on');
    if($('tabbar')&&!Object.values(sheets).some(s=>s.classList.contains('open'))) setActiveTab(null);
  }
  $('filterClose').addEventListener('click', exitPhoto);
  $('clearBtn').addEventListener('click', clearAll);

  function clearAll(){
    stickers.forEach(s=>s.el.remove()); stickers=[]; active=null;
    setFrame('none');
  }

  /* ---- frame masks ---- */
  function heartPoints(cx,cy,scale){
    const p=[];
    for(let i=0;i<=64;i++){ const t=i/64*Math.PI*2;
      const x=16*Math.pow(Math.sin(t),3);
      const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
      p.push([cx+x*scale, cy-y*scale]); }
    return p;
  }
  function starPoints(cx,cy,R){
    const p=[]; const inner=R*0.42;
    for(let i=0;i<10;i++){ const a=(-90+i*36)*Math.PI/180; const r=(i%2===0)?R:inner;
      p.push([cx+r*Math.cos(a), cy+r*Math.sin(a)]); }
    return p;
  }
  function ptsToPath(p){ return 'M'+p.map(a=>a[0].toFixed(1)+' '+a[1].toFixed(1)).join(' L')+' Z'; }

  function drawFrameMask(){
    const svg=$('frameMask');
    if(activeFrame==='none'){ svg.style.display='none'; svg.innerHTML=''; return; }
    const w=innerWidth,h=innerHeight, cx=w/2, cy=h*0.42;
    let inner;
    if(activeFrame==='heart') inner=ptsToPath(heartPoints(cx,cy,Math.min(w,h)*0.026));
    else inner=ptsToPath(starPoints(cx,cy,Math.min(w,h)*0.40));
    svg.setAttribute('viewBox',`0 0 ${w} ${h}`); svg.setAttribute('width',w); svg.setAttribute('height',h);
    const d=`M0 0 H${w} V${h} H0 Z `+inner;
    svg.innerHTML=`<path d="${d}" fill="#F6EFE2" fill-rule="evenodd"/>`;
    svg.style.display='block';
  }
  function setFrame(f){
    activeFrame=f;
    document.querySelectorAll('#filterStrip .fgroup:first-child .fchip').forEach((c,i)=>c.classList.toggle('sel',['none','heart','star'][i]===f));
    drawFrameMask();
    syncLiveName();
    if(f!=='none') showHint(tr().hintFrame);
  }
  const liveNameEl=()=>$('liveName');
  function syncLiveName(){
    const v=($('nameInput').value||'').trim();
    const el=$('liveName');
    el.textContent=v;
    el.classList.toggle('on', !!v && $('filterBar').classList.contains('on'));
    el.classList.toggle('paper', activeFrame!=='none');
  }
  $('nameInput').addEventListener('input', syncLiveName);

  /* ---- multi stickers ---- */
  let stickers=[]; let active=null;
  const MIN_HIT=88;

  function setActive(s){
    active=s;
    if(s) bringToFront(s);
    stickers.forEach(x=>x.el.classList.toggle('on', x===s));
  }
  function bringToFront(s){
    $('fxLayer').appendChild(s.el);              // paints above the other stickers
    const i=stickers.indexOf(s); if(i>=0){ stickers.splice(i,1); stickers.push(s); }  // drawn last on export
  }
  function removeSticker(s){
    s.el.remove(); stickers=stickers.filter(x=>x!==s);
    if(active===s) active=stickers.length?stickers[stickers.length-1]:null;
    if(active) active.el.classList.add('on');
  }
  function addSticker(item){
    const wrap=document.createElement('div'); wrap.className='sticker';
    const img=document.createElement('img'); img.className='simg'; img.src=item.url; img.alt='';
    const del=document.createElement('button'); del.className='sdel'; del.innerHTML='✕';
    wrap.appendChild(img); wrap.appendChild(del);
    $('fxLayer').appendChild(wrap);
    const baseW=innerWidth*0.40;
    const s={ el:wrap, img, del, x:innerWidth*0.5, y:innerHeight*0.42, scale:1, rot:0,
              baseW, aspect:1/(item.aspect||1), src:item.url };
    stickers.push(s); setActive(s); layoutSticker(s);
    del.addEventListener('click',(e)=>{ e.stopPropagation(); removeSticker(s); });
    wrap.addEventListener('mousedown',e=>{ if(e.target===del) return; setActive(s);
      const bx=s.x,by=s.y,sx=e.clientX,sy=e.clientY;
      const mv=ev=>{ s.x=bx+(ev.clientX-sx); s.y=by+(ev.clientY-sy); layoutSticker(s); };
      const up=()=>{ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); };
      document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
    });
    showHint(tr().hintDrag);
  }
  function layoutSticker(s){
    const vw=s.baseW*s.scale, vh=vw*s.aspect;
    const hit=Math.max(vw,vh,MIN_HIT);
    s.el.style.width=hit+'px'; s.el.style.height=hit+'px';
    s.el.style.transformOrigin='center center';
    s.el.style.transform=`translate3d(${s.x}px,${s.y}px,0) translate(-50%,-50%) rotate(${s.rot}deg)`;
    s.img.style.width=vw+'px'; s.img.style.height=vh+'px';
    const off=(hit-Math.max(vw,vh))/2;
    s.del.style.top=Math.max(0,(hit-vh)/2-4)+'px';
    s.del.style.right=Math.max(0,(hit-vw)/2-4)+'px';
  }

  function stickerAt(x,y){
    for(let i=stickers.length-1;i>=0;i--){
      const r=stickers[i].el.getBoundingClientRect();
      if(x>=r.left && x<=r.right && y>=r.top && y<=r.bottom) return stickers[i];
    }
    return null;
  }

  (function gestures(){
    const layer=$('fxLayer');
    let count=0, mode=null, sCx=0,sCy=0,sDist=0,sAng=0, bX=0,bY=0,bScale=1,bRot=0;
    const list=e=>Array.from(e.touches);
    const cen=ts=>{let x=0,y=0;ts.forEach(t=>{x+=t.clientX;y+=t.clientY;});return{x:x/ts.length,y:y/ts.length};};
    const dis=ts=>Math.hypot(ts[0].clientX-ts[1].clientX,ts[0].clientY-ts[1].clientY);
    const ang=ts=>Math.atan2(ts[1].clientY-ts[0].clientY,ts[1].clientX-ts[0].clientX)*180/Math.PI;
    function rebase(ts){ count=ts.length; const c=cen(ts); sCx=c.x; sCy=c.y;
      if(active){ bX=active.x; bY=active.y; bScale=active.scale; bRot=active.rot; }
      if(ts.length>=2){ sDist=dis(ts)||1; sAng=ang(ts); } }
    layer.addEventListener('touchstart',e=>{
      const ts=list(e);
      // tap on a delete badge → remove that sticker (touch would otherwise cancel the click)
      if(e.target && e.target.closest && e.target.closest('.sdel')){
        const wrap=e.target.closest('.sticker'); const s=stickers.find(x=>x.el===wrap);
        if(s) removeSticker(s); e.preventDefault(); mode=null; return;
      }
      if(ts.length>=2){ if(!active&&stickers.length) setActive(stickers[stickers.length-1]); if(!active) return;
        mode='xform'; e.preventDefault(); rebase(ts); }
      else if(ts.length===1){
        const hit=stickerAt(ts[0].clientX,ts[0].clientY);
        if(hit){ setActive(hit); mode='drag'; e.preventDefault(); rebase(ts); }
        else { mode=null; }
      }
    },{passive:false});
    layer.addEventListener('touchmove',e=>{
      if(!mode||!active) return; const ts=list(e); if(!ts.length) return; e.preventDefault();
      if(ts.length!==count){ mode=ts.length>=2?'xform':'drag'; rebase(ts); }
      const c=cen(ts);
      active.x=bX+(c.x-sCx); active.y=bY+(c.y-sCy);
      if(mode==='xform'&&ts.length>=2){
        active.scale=Math.max(0.25,Math.min(4.5, bScale*(dis(ts)/sDist)));
        active.rot=bRot+(ang(ts)-sAng);
      }
      layoutSticker(active);
    },{passive:false});
    const end=e=>{ const ts=list(e); if(!ts.length){ mode=null; } else { mode=ts.length>=2?'xform':'drag'; rebase(ts); } };
    layer.addEventListener('touchend',end,{passive:false});
    layer.addEventListener('touchcancel',end,{passive:false});
    // tap empty to deselect
    layer.addEventListener('click',e=>{ if(e.target===layer){ stickers.forEach(x=>x.el.classList.remove('on')); active=null; } });
  })();

  window.addEventListener('resize',()=>{ if($('filterBar').classList.contains('on')) drawFrameMask(); });

  let hintTimer=null;
  function showHint(txt){ const h=$('fxHint'); if(!txt){ h.classList.remove('on'); return; }
    h.textContent=txt; h.classList.add('on'); clearTimeout(hintTimer); hintTimer=setTimeout(()=>h.classList.remove('on'),2600); }

  /* ---- snap ---- */
  $('snapBtn').addEventListener('click', takePhoto);

  async function takePhoto(){
    try{ await document.fonts.load('400 60px Pacifico'); await document.fonts.load('600 40px Cormorant'); }catch(e){}
    const W=1080, H=1350;                        // Instagram 4:5 portrait
    const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
    const cx=cv.getContext('2d');

    // camera cover-cropped to 4:5
    if(video.videoWidth){
      const vw=video.videoWidth, vh=video.videoHeight, s=Math.max(W/vw,H/vh);
      const dw=vw*s, dh=vh*s; cx.drawImage(video,(W-dw)/2,(H-dh)/2,dw,dh);
    } else {
      const g=cx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#FBF8F1'); g.addColorStop(1,'#EFE6D4');
      cx.fillStyle=g; cx.fillRect(0,0,W,H);
    }

    // frame window (paper outside)
    if(activeFrame!=='none'){
      const off=document.createElement('canvas'); off.width=W; off.height=H; const ox=off.getContext('2d');
      ox.fillStyle='#F6EFE2'; ox.fillRect(0,0,W,H);
      const fcx=W/2, fcy=H*0.40; ox.globalCompositeOperation='destination-out';
      const pts=(activeFrame==='heart')?heartPoints(fcx,fcy,W*0.028):starPoints(fcx,fcy,W*0.40);
      ox.beginPath(); ox.moveTo(pts[0][0],pts[0][1]); pts.forEach(p=>ox.lineTo(p[0],p[1])); ox.closePath(); ox.fill();
      ox.globalCompositeOperation='source-over'; cx.drawImage(off,0,0);
    }

    // stickers mapped screen->photo
    const cam=video.getBoundingClientRect();
    const vw=video.videoWidth, vh=video.videoHeight;
    stickers.forEach(st=>{
      const curW=st.baseW*st.scale; let px,py,dw;
      if(vw&&vh&&cam.width&&cam.height){
        const ss=Math.max(cam.width/vw, cam.height/vh);
        const dvw=vw*ss, dvh=vh*ss, oxs=(cam.width-dvw)/2, oys=(cam.height-dvh)/2;
        const u=((st.x-cam.left)-oxs)/dvw, v=((st.y-cam.top)-oys)/dvh;
        const sp=Math.max(W/vw,H/vh); const dpw=vw*sp, dph=vh*sp, oxp=(W-dpw)/2, oyp=(H-dph)/2;
        px=oxp+u*dpw; py=oyp+v*dph; dw=curW*(sp/ss);
      } else { px=(st.x/innerWidth)*W; py=(st.y/innerHeight)*H; dw=curW*(W/innerWidth); }
      const dh=dw*st.aspect;
      cx.save(); cx.translate(px,py); cx.rotate(st.rot*Math.PI/180);
      cx.drawImage(st.img,-dw/2,-dh/2,dw,dh); cx.restore();
    });

    // ---- overlays (no band — the photo shows through) ----
    const onPaper = activeFrame!=='none';                 // frame area is paper → dark text
    const fg  = onPaper ? '#241C12' : '#FFFFFF';
    const sub = onPaper ? 'rgba(36,28,18,.60)' : 'rgba(255,255,255,.85)';
    const setShadow = on => {
      if(on && !onPaper){ cx.shadowColor='rgba(0,0,0,.5)'; cx.shadowBlur=14; cx.shadowOffsetX=0; cx.shadowOffsetY=3; }
      else { cx.shadowColor='transparent'; cx.shadowBlur=0; cx.shadowOffsetX=0; cx.shadowOffsetY=0; }
    };
    const ls = v => { if('letterSpacing' in cx) cx.letterSpacing=v; };
    const name=($('nameInput').value||'').trim();

    // custom name — top centre
    if(name){
      cx.textAlign='center'; cx.textBaseline='middle'; setShadow(true);
      let fs=Math.round(W*0.088); cx.font=`400 ${fs}px Pacifico, cursive`;
      while(cx.measureText(name).width>W*0.86 && fs>24){ fs-=2; cx.font=`400 ${fs}px Pacifico, cursive`; }
      cx.fillStyle=fg; cx.fillText(name, W/2, Math.round(H*0.088)); setShadow(false);
    }

    const pad=Math.round(W*0.05), qs=Math.round(W*0.135), qy=H-pad-qs, qx=pad;
    const txx=qx+qs+Math.round(W*0.038);
    const drawBottom=()=>{
      cx.textAlign='left';
      // wordmark — normal type, close to the logo
      setShadow(true);
      cx.fillStyle=fg; cx.textBaseline='alphabetic';
      cx.font=`600 ${Math.round(W*0.05)}px system-ui, -apple-system, sans-serif`;
      cx.save(); ls('2px'); cx.fillText('BREADVENTURE', txx, qy+qs*0.44); ls('normal'); cx.restore();
      // address — just under
      cx.fillStyle=sub; cx.font=`500 ${Math.round(W*0.0265)}px system-ui, -apple-system, sans-serif`;
      cx.save(); ls('.5px'); cx.fillText('24 Do Quang Street · Thao Dien · Saigon', txx, qy+qs*0.82); ls('normal'); cx.restore();
      setShadow(false);
      exportPhoto(cv);
    };

    // QR — bottom-left, on a light tile so it stays scannable
    setShadow(true);
    cx.fillStyle='#FBF8F1'; roundRect(cx,qx-8,qy-8,qs+16,qs+16,16); cx.fill(); setShadow(false);
    if(qrImg.complete && qrImg.naturalWidth) cx.drawImage(qrImg,qx,qy,qs,qs);
    drawBottom();
  }
  function roundRect(cx,x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r);
    cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }

  function flash(){ const f=$('flash'); f.classList.add('on'); setTimeout(()=>f.classList.remove('on'),260); }
  function exportPhoto(cv){
    flash();
    cv.toBlob(async(blob)=>{
      const url=URL.createObjectURL(blob);
      const file=new File([blob],'breadventure.png',{type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file],title:'Breadventure',text:'Breadventure · '+COPY}); URL.revokeObjectURL(url); return; }
        catch(e){}
      }
      showPreview(url);
    },'image/png');
  }
  function showPreview(url){
    $('photoImg').src=url; const a=$('savePhoto'); a.href=url; a.download='breadventure.png';
    $('savePhoto').textContent=tr().snapBtn+' ✓'; $('photoClose').textContent=tr().snapClear;
    $('photoPrev').classList.add('on');
  }
  $('photoClose').addEventListener('click',()=>$('photoPrev').classList.remove('on'));

  /* ---------------- tabbar ---------------- */
  document.querySelectorAll('#tabbar button').forEach(b=>{
    b.addEventListener('click',()=>{
      const act=b.dataset.act;
      if(act==='about'){ exitPhoto(); openSheet('about'); }
      else if(act==='menu'){ exitPhoto(); openSheet('menu'); }
      else if(act==='snap'){ closeSheets(); enterPhoto(); }
      else if(act==='follow'){ window.open(IG_URL,'_blank'); }
    });
  });

  /* ---------------- manifest ---------------- */
  (function buildManifest(){
    try{
      const man={ name:'Breadventure', short_name:'Breadventure', start_url:'./', scope:'./',

  /* ---------------- init ---------------- */
  document.addEventListener('touchmove',function(e){
    if(e.target.closest && e.target.closest('.sheet-body, #filterStrip')) return;
    e.preventDefault();
  },{passive:false});

  applyLang();

  (function(){ const m='url("'+QR_URL+'") center/contain no-repeat';
    const el=$('aboutQr'); if(el){ el.style.webkitMask=m; el.style.mask=m; } })();

  /* install tip: first visit only */
  (function installTip(){
    const tip=$('installTip'); if(!tip) return;
    const t=tr();
    $('tipTitle').textContent=t.installTitle;
    $('tipBody').textContent = isIOS ? t.installIOS : t.installAndroid;
    $('tipIcon').innerHTML = isIOS ? IC.share : IC.dots;
    $('tipClose').addEventListener('click',()=>{ tip.style.display='none'; });
    try{
      const v=parseInt(localStorage.getItem('bv_visits')||'0',10);
      if(v<1 && !isStandalone && (isIOS||isAndroid)) tip.style.display='flex';
      localStorage.setItem('bv_visits', String(v+1));
    }catch(e){}
  })();

  // refresh install-tip text on language change
  const _apply=applyLang;
})();
